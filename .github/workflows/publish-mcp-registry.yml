name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io with GitHub OIDC, so no registry token is stored.
# The npm package is published by hand first (the npm account requires 2FA in the browser); the registry
# checks that the version in server.json exists on npm and carries the matching mcpName.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check versions match
        run: |
          set -euo pipefail
          package_version="$(jq -r .version package.json)"
          server_version="$(jq -r .version server.json)"
          npm_entry_version="$(jq -r '.packages[0].version' server.json)"
          if [ "$package_version" != "$server_version" ] || [ "$package_version" != "$npm_entry_version" ]; then
            echo "package.json ($package_version) and server.json ($server_version / $npm_entry_version) disagree." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${package_version}." >&2
            exit 1
          fi
          published="$(npm view "drawoffer-mcp@${package_version}" mcpName --registry=https://registry.npmjs.org/ || true)"
          if [ "$published" != "$(jq -r .name server.json)" ]; then
            echo "drawoffer-mcp@${package_version} is not on npm with mcpName $(jq -r .name server.json); publish it first." >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
